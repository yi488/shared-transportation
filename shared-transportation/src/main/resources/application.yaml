spring:
  application:
    name: shared-transportation
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:shared_transportation}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:linche}
    password: ${DB_PASSWORD:linche123}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  # 生产环境请务必替换为随机密钥（至少 32 字节）
  secret: ${JWT_SECRET:linche-shared-transportation-secret-key-please-change-in-prod-2026}
  # token 有效期（毫秒），默认 7 天
  expiration: ${JWT_EXPIRATION:604800000}

admin:
  # 默认管理员账号（首次启动自动创建），生产环境请务必修改
  phone: ${ADMIN_PHONE:13800000000}
  password: ${ADMIN_PASSWORD:admin123}

alipay:
  # ===== 支付宝支付配置（app-id 留空时走「模拟支付」，便于开发联调）=====
  # 应用 APPID（支付宝开放平台申请）
  app-id: 9021000167691023 
  private-key: 
  alipay-public-key: 
  # 网关：沙箱 https://openapi-sandbox.dl.alipaydev.com/gateway.do ｜ 正式 https://openapi.alipay.com/gateway.do
  gateway: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  # 异步通知地址（需公网可访问）
  notify-url: http://pd6e7c93.natappfree.cc/api/pay/notify  
  # 同步返回地址（支付完成后跳回前端）
  return-url: http://localhost:3000/

app:
  # 车辆图片上传目录
  upload-dir: ${UPLOAD_DIR:./uploads}

server:
  port: 8080
